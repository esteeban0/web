<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Vehículo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            background-color: #e8f0fe;
            border-radius: 5px;
            padding: 10px;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        button {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Inspección de Vehículo</h2>
        <form id="formulario">
            <input type="text" name="nombre" placeholder="Nombre del Inspector" required>
            <select name="placa" required>
                <option value="" disabled selected>Placa del Vehículo</option>
                <option value="XYZ789">XYZ789</option>
                <option value="ABC123">ABC123</option>
            </select>
            <select name="modelo" required>
                <option value="" disabled selected>Modelo del Vehículo</option>
                <option value="SUV">SUV</option>
                <option value="Sedan">Sedan</option>
            </select>
            <input type="text" name="kilometraje" id="kilometraje" placeholder="Kilometraje" required>
            <textarea name="descripcion" placeholder="Descripción del Estado" required></textarea>

            <h3>Encuesta:</h3>
            <table>
                <tr>
                    <th>Pregunta</th>
                    <th>Sí</th>
                    <th>No</th>
                </tr>
                <tr>
                    <td>Llantas en buen estado</td>
                    <td><input type="radio" name="llantas" value="Sí"></td>
                    <td><input type="radio" name="llantas" value="No"></td>
                </tr>
                <tr>
                    <td>Papeles en regla</td>
                    <td><input type="radio" name="papeles" value="Sí"></td>
                    <td><input type="radio" name="papeles" value="No"></td>
                </tr>
                <tr>
                    <td>Cinturón de seguridad funcional</td>
                    <td><input type="radio" name="cinturon" value="Sí"></td>
                    <td><input type="radio" name="cinturon" value="No"></td>
                </tr>
            </table>

            <h3>Sube fotos:</h3>
            <input type="file" name="foto1" required>
            <input type="file" name="foto2" required>

            <button type="submit">Enviar</button>
        </form>
    </div>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let formData = new FormData(this);
            
            fetch("https://TU_SERVIDOR/webhook", {  
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => alert("Datos enviados al bot"))
            .catch(error => console.error("Error:", error));
        });

        // Formato automático para kilometraje con puntos de miles
        document.getElementById("kilometraje").addEventListener("input", function() {
            let valor = this.value.replace(/\D/g, ""); // Elimina caracteres no numéricos
            this.value = valor.replace(/\B(?=(\d{3})+(?!\d))/g, "."); // Agrega puntos de miles
        });
    </script>
</body>
</html>
