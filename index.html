<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Vehículo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        .checkbox-group input {
            margin-right: 10px;
        }
        button {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <h2>Inspección de Vehículo</h2>
    <form id="formulario">
        <label>Nombre del Inspector</label>
        <input type="text" name="nombre" placeholder="Nombre del Inspector" required>
        
        <label>Placa del Vehículo</label>
        <select name="placa" required>
            <option value="">Seleccione Placa</option>
            <option value="ABC123">ABC123</option>
            <option value="XYZ789">XYZ789</option>
        </select>
        
        <label>Modelo del Vehículo</label>
        <select name="modelo" required>
            <option value="">Seleccione Modelo</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
        </select>
        
        <label>Kilometraje</label>
        <input type="number" name="kilometraje" placeholder="Kilometraje" required>
        
        <label>Descripción del Estado</label>
        <textarea name="descripcion" placeholder="Descripción del Estado" required></textarea>
        
        <label>Encuesta:</label>
        <div class="checkbox-group">
            <input type="checkbox" name="llantas" value="buen_estado"> Llantas en buen estado
        </div>
        <div class="checkbox-group">
            <input type="checkbox" name="papeles" value="en_regla"> Papeles en regla
        </div>
        <div class="checkbox-group">
            <input type="checkbox" name="cinturon" value="funcional"> Cinturón de seguridad funcional
        </div>
        
        <label>Sube fotos:</label>
        <input type="file" name="foto_motor" accept="image/*">
        <input type="file" name="foto_trasera" accept="image/*">
        
        <button type="submit">Enviar</button>
    </form>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();
            let formData = new FormData(this);
            fetch("https://TU_SERVIDOR/webhook", {  // Cambia TU_SERVIDOR por tu IP o dominio
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => alert("Datos enviados al bot"))
            .catch(error => console.error("Error:", error));
        });
    </script>
</body>
</html>
