<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Vehículo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        input, select, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
            border: none;
        }
        .image-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Inspección de Vehículo</h2>
        <form id="formulario">
            <input type="text" name="nombre" placeholder="Nombre del Inspector" required>
            <select name="placa" required>
                <option value="">Seleccione Placa</option>
                <option value="ABC123">ABC123</option>
                <option value="XYZ789">XYZ789</option>
            </select>
            <select name="modelo" required>
                <option value="">Seleccione Modelo</option>
                <option value="Toyota Corolla">Toyota Corolla</option>
                <option value="Nissan Versa">Nissan Versa</option>
            </select>
            <input type="number" name="km" placeholder="Kilometraje" required>
            <textarea name="descripcion" placeholder="Descripción del Estado" required></textarea>
            
            <label>Encuesta:</label>
            <label><input type="checkbox" name="llantas" value="Sí"> Llantas en buen estado</label>
            <label><input type="checkbox" name="papeles" value="Sí"> Papeles en regla</label>
            <label><input type="checkbox" name="cinturon" value="Sí"> Cinturón de seguridad funcional</label>
            
            <label>Sube fotos:</label>
            <input type="file" id="foto_motor" name="foto_motor" accept="image/*">
            <img id="preview_motor" class="image-preview">
            <input type="file" id="foto_trasera" name="foto_trasera" accept="image/*">
            <img id="preview_trasera" class="image-preview">
            
            <button type="submit">Enviar</button>
        </form>
    </div>
    
    <script>
        function previewImage(input, previewId) {
            const file = input.files[0];
            const preview = document.getElementById(previewId);
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }
        
        document.getElementById("foto_motor").addEventListener("change", function() {
            previewImage(this, "preview_motor");
        });
        document.getElementById("foto_trasera").addEventListener("change", function() {
            previewImage(this, "preview_trasera");
        });
    </script>
</body>
</html>
